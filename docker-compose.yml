version: "3.9"

services:
  # ─── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: budgetbuddy-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - budgetbuddy-net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.runCommand('ping').ok" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budgetbuddy-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/budgetbuddy}
      - JWT_SECRET=${JWT_SECRET:-changeme_in_production}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost}
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - budgetbuddy-net
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: budgetbuddy-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - budgetbuddy-net

# ─── Volumes & Networks ────────────────────────────────────────────────────────
volumes:
  mongo_data:

networks:
  budgetbuddy-net:
    driver: bridge
